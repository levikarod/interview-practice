# Questions that work for any backend-leaning engineer, so a fresh clone has
# something real to practise before any CV is ingested.
#
# `tags` are the retrieval keys. They are matched against each story's `tags` and
# `aliases`, which is why story aliases are worth generating carefully - a
# question says "idempotency" and a story has to answer to that word.
#
# `seconds` is the answer budget and the recording hard-stops there. 90 is right
# for a mechanism question, 150 for one that needs a full STAR arc.

- id: idempotency
  text: How did you implement idempotency?
  kind: technical
  seconds: 120
  tags: [idempotency, retries, deduplication, correctness, distributed-systems]

- id: hardest-bug
  text: Tell me about the hardest bug you've debugged. How did you find it?
  kind: behavioural
  seconds: 150
  tags: [incident, debugging, root-cause, postmortem, failure]

- id: production-incident
  text: Walk me through a production incident you owned end to end.
  kind: behavioural
  seconds: 150
  tags: [incident, on-call, outage, postmortem, reliability, customer-impact]

- id: scaling-bottleneck
