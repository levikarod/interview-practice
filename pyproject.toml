[project]
name = "interview-practice"
version = "0.1.0"
description = "Practise spoken interview answers against your own CV and story bank."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",   # multipart form upload (audio, CV)
    "pydantic>=2.9",
    "faster-whisper>=1.2",       # local transcription; decodes via bundled PyAV
    "pypdf>=5.1",                # CV text extraction
    "pyyaml>=6.0",               # story frontmatter, question bank
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]        # only needed for LLM_BACKEND=api

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
