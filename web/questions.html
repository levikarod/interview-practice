<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions · Interview Practice</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Questions</h1>
  <p class="sub"><a href="/">← Back to practice</a></p>
</header>

<main>

  <section class="card">
    <h2>From a job description</h2>
    <p class="muted small">
      Questions are drafted where the role's requirements overlap your own
      material, plus a couple aimed at gaps worth rehearsing honestly.
      Nothing is saved until you pick.
    </p>
    <textarea id="jd" rows="7"
      placeholder="Paste the full posting — responsibilities and requirements are where the questions come from."></textarea>
    <div class="controls">
      <button id="generate" class="primary">Generate questions</button>
      <span class="muted small" id="jd-status"></span>
    </div>

    <div id="drafted" hidden>
      <p class="role-summary" id="role-summary"></p>
      <div class="controls">
        <button id="select-all" class="ghost">Select all</button>
        <button id="select-none" class="ghost">Select none</button>
        <button id="keep" class="primary">Add selected</button>
      </div>
      <ul class="drafts" id="drafts"></ul>
    </div>

    <p id="jd-error" class="error" hidden></p>
  </section>

  <section class="card">
    <h2>Your bank</h2>
    <div class="controls">
      <input id="filter" type="search" placeholder="Filter by text or tag">
      <label class="toggle">
        <input type="checkbox" id="show-disabled"> show turned off
      </label>
      <button id="add-new" class="ghost">Add your own</button>
      <span class="muted small" id="bank-count"></span>
    </div>
    <ul class="qlist" id="qlist"></ul>
  </section>

</main>

<dialog id="editor">
  <form method="dialog" id="edit-form">
    <h3 id="edit-title">Edit question</h3>
    <label>Question<textarea name="text" rows="3" required></textarea></label>
    <div class="row">
      <label>Kind
        <select name="kind">
          <option value="technical">technical</option>
          <option value="behavioural">behavioural</option>
          <option value="system-design">system-design</option>
        </select>
      </label>
      <label>Seconds<input name="seconds" type="number" min="30" max="600" step="10"></label>
    </div>
    <label>Tags <span class="muted small">comma separated — these decide which of your stories gets found</span>
      <input name="tags" type="text">
    </label>
    <p id="edit-error" class="error" hidden></p>
    <div class="controls">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="save" class="primary" id="save-question">Save</button>
    </div>
  </form>
</dialog>

<script src="/static/questions.js"></script>
</body>
</html>
